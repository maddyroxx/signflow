<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="signflow_bg" x1="0" y1="0" x2="180" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6C4CE8"/>
      <stop offset="55%" stop-color="#4B35A8"/>
      <stop offset="100%" stop-color="#24A875"/>
    </linearGradient>
    <linearGradient id="flow_wave" x1="20" y1="90" x2="160" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A7F3D0"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="soft_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6C4CE8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Rich Brand Gradient -->
  <rect width="180" height="180" rx="48" fill="url(#signflow_bg)"/>

  <!-- Top Glass Sheen -->
  <path d="M0 48C0 21.4903 21.4903 0 48 0H132C158.51 0 180 21.4903 180 48V75C180 75 130 95 90 95C50 95 0 75 0 75V48Z" fill="white" fill-opacity="0.12"/>

  <!-- Fluid Flow Wave Stream -->
  <path d="M22 98C42 80 68 78 90 95C112 112 138 114 158 92" stroke="url(#flow_wave)" stroke-width="12" stroke-linecap="round" opacity="0.85"/>
  <path d="M30 124C50 108 74 107 94 121C114 135 136 135 152 118" stroke="#6EE7B7" stroke-width="7" stroke-linecap="round" opacity="0.6"/>

  <!-- Expressive Signing Hand Silhouette -->
  <g transform="translate(18, 12) scale(6)" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M18 11V6C18 4.89543 17.1046 4 16 4C14.8954 4 14 4.89543 14 6V10M14 6C14 4.89543 13.1046 4 12 4C10.8954 4 10 4.89543 10 6V11M10 6C10 4.89543 9.10457 4 8 4C6.89543 4 6 4.89543 6 6V13C6 16.866 9.13401 20 13 20H14C17.3137 20 20 17.3137 20 14V10C20 8.89543 19.1046 8 18 8C16.8954 8 16 8.89543 16 10"/>
  </g>

  <!-- Flow Pulse Accent Dot -->
  <circle cx="146" cy="42" r="10" fill="#34D399" filter="drop-shadow(0 0 6px #34D399)"/>
</svg>